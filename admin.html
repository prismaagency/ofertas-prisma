<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Prisma Agency</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:1100px;margin:40px auto;padding:0 20px}.admin-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.admin-list{display:grid;gap:12px;margin-top:18px}.admin-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px;border:1px solid var(--border);border-radius:12px}.admin-row small{color:var(--muted)}.admin-msg{min-height:22px;margin-top:12px}.admin-denied{max-width:600px;margin:80px auto;padding:30px;text-align:center}.admin-row .admin-actions{margin-top:0}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.admin-row{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="admin-wrap"><section class="admin-card"><span class="eyebrow">Prisma Agency</span><h1>Panel administrativo</h1><p id="adminUser">Comprobando acceso...</p><div class="admin-actions"><button class="btn btn--ghost" id="logoutBtn">Cerrar sesión</button><a class="btn btn--ghost" href="index.html">Ver página</a></div></section>
<section class="admin-card"><h2>Ofertas Flash</h2><p style="color:var(--muted);margin:8px 0 18px">Las ofertas se muestran mientras el contador esté activo.</p><form id="offerForm"><input type="hidden" id="offerId"><div class="admin-grid"><label>Destino<input id="destination" required></label><label>Precio mostrado<input id="price" placeholder="USD 7,500" required></label><label>Finaliza<input id="endsAt" type="datetime-local"></label><label>Activa<select id="active"><option value="true">Sí</option><option value="false">No</option></select></label></div><div class="admin-actions"><button class="btn btn--primary" type="submit">Guardar oferta</button><button class="btn btn--ghost" type="button" id="clearBtn">Nueva oferta</button></div><p class="admin-msg" id="msg"></p></form><div class="admin-list" id="offerList"></div></section>
<section class="admin-card"><h2>Contador Flash</h2><div class="admin-grid"><label>Fecha y hora de reinicio<input id="deadline" type="datetime-local"></label></div><div class="admin-actions"><button class="btn btn--primary" id="saveDeadline">Guardar contador</button></div><p class="admin-msg" id="deadlineMsg"></p></section></main><script type="module" src="admin.js"></script></body></html>
