<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-light);
        background-image: linear-gradient(rgba(8, 8, 10, 0.85), rgba(8, 8, 10, 0.95)), url('image_f53400.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

    .portada-wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 5%;
        background: rgba(8, 8, 10, 0.5);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo img {
        height: 50px;
    }

    nav ul {
        display: flex;
        list-style: none;
        gap: 30px;
    }

    nav a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s ease;
    }

    nav a:hover {
        color: var(--gold);
    }

    .btn-contact {
        background-color: var(--gold);
        color: #000;
        padding: 10px 24px;
        border-radius: 5px;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.3s;
    }

    .btn-contact:hover {
        background-color: var(--gold-hover);
    }

    .hero {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 10%;
        max-width: 900px;
    }

    .badge {
        background-color: rgba(245, 158, 11, 0.1);
        color: var(--gold);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        border: 1px solid var(--gold);
        width: fit-content;
        margin-bottom: 20px;
    }

    .hero h1 {
        font-family: 'Playfair Display', serif;
        font-size: 4.5rem;
        line-height: 1.1;
        margin-bottom: 20px;
    }

    .hero h1 span {
        color: var(--gold);
    }

    .hero p {
        color: var(--text-muted);
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 40px;
        max-width: 600px;
    }

    .cta-buttons {
        display: flex;
        gap: 15px;
    }

    .btn-primary {
        background-color: var(--gold);
        color: #000;
        padding: 15px 30px;
        border: none;
        border-radius: 5px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        transition: background 0.3s;
    }

    .btn-primary:hover {
        background-color: var(--gold-hover);
    }

    .btn-secondary {
        background-color: transparent;
        color: var(--text-light);
        padding: 15px 30px;
        border: 1px solid #333;
        border-radius: 5px;
        font-size: 1rem;
        cursor: pointer;
        text-decoration: none;
        transition: border 0.3s;
        display: inline-block;
    }

    .btn-secondary:hover {
        border-color: var(--gold);
    }

    /* SECCIÓN POR QUÉ NOSOTROS */
    .nosotros-section {
        padding: 90px 10%;
        background: linear-gradient(180deg, var(--bg-color) 0%, #0d111a 100%);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .section-header {
        text-align: center;
        max-width: 750px;
        margin: 0 auto 50px;
    }

    .section-header h2 {
        font-family: 'Playfair Display', serif;
        font-size: 3rem;
        margin-bottom: 15px;
    }

    .section-header h2 span {
        color: var(--gold);
    }

    .section-header p {
        color: var(--text-muted);
        font-size: 1.1rem;
        line-height: 1.6;
    }

    .nosotros-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 30px;
    }

    .nosotros-card {
        background-color: var(--card-bg);
        border-radius: 12px;
        padding: 35px 25px;
        border: 1px solid rgba(245, 158, 11, 0.15);
        transition: transform 0.3s, border-color 0.3s;
    }

    .nosotros-card:hover {
        transform: translateY(-5px);
        border-color: var(--gold);
    }

    .nosotros-icon {
        font-size: 2.2rem;
        margin-bottom: 20px;
        color: var(--gold);
    }

    .nosotros-card h3 {
        font-size: 1.3rem;
        margin-bottom: 12px;
        color: var(--text-light);
    }

    .nosotros-card p {
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.5;
    }

    /* SECCIÓN DESTINOS */
    .destinos-section {
        padding: 80px 10%;
        background-color: var(--bg-color);
    }

    .destinos-header h2 {
        font-family: 'Playfair Display', serif;
        font-size: 3rem;
        margin-bottom: 15px;
    }

    .destinos-header p {
        color: var(--text-muted);
        margin-bottom: 30px;
        max-width: 700px;
        line-height: 1.5;
    }

    .grid-destinos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 25px;
    }

    .card {
        background-color: var(--card-bg);
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: transform 0.3s, border-color 0.3s;
        cursor: pointer;
    }

    .card:hover {
        transform: translateY(-5px);
        border-color: var(--gold);
    }

    .card-img {
        height: 160px;
        background-color: #1a1a24;
        position: relative;
    }

    .card-img img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        display: block;
    }

    .card-info {
        padding: 20px;
    }

    .card-info h3 {
        font-size: 1.25rem;
        margin-bottom: 5px;
    }

    .card-info p {
        color: var(--gold);
        font-weight: 600;
        font-size: 0.95rem;
    }

    .floating-social {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 999;
    }

    .floating-btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: white;
        font-size: 24px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .wa-btn { background-color: #25D366; }

    /* MODAL GENERAL */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.85);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .modal-content {
        background-color: var(--modal-bg);
        border-radius: 16px;
        width: 100%;
        max-width: 460px;
        max-height: 90vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        position: relative;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        animation: modalFadeIn 0.3s;
    }

    .modal-content::-webkit-scrollbar { width: 6px; }
    .modal-content::-webkit-scrollbar-track { background: var(--modal-bg); }
    .modal-content::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

    @keyframes modalFadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .modal-header-bg {
        height: 140px;
        position: relative;
        background-size: cover;
        background-position: center;
        border-radius: 16px 16px 0 0;
    }

    .modal-header-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(to right, rgba(15, 23, 42, 0.95) 35%, rgba(15, 23, 42, 0.4) 100%);
        border-radius: 16px 16px 0 0;
        padding: 25px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }

    .close {
        color: rgba(255,255,255,0.7);
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 24px;
        font-weight: 300;
        cursor: pointer;
        transition: color 0.3s;
        z-index: 10;
        background: transparent;
        border: none;
    }

    .close:hover { color: #fff; }

    .modal-title {
        font-family: 'Playfair Display', serif;
        color: #ffffff;
        font-size: 2.2rem;
        margin-bottom: 2px;
        line-height: 1;
    }

    .modal-price {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--gold);
    }

    .modal-body {
        padding: 25px;
    }

    .modal-subtitle {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 25px;
    }

    .modal-subtitle svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
    }

    .info-boxes {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
    }

    .info-box {
        background-color: var(--modal-card);
        border-radius: 12px;
        padding: 15px;
        flex: 1;
    }

    .info-box-label {
        color: var(--text-muted);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
    }

    .info-box-value {
        color: #ffffff;
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.3;
    }

    .section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #ffffff;
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 15px;
    }

    .check-icon {
        color: var(--gold);
        font-weight: bold;
        font-size: 1.2rem;
    }

    .custom-list {
        list-style: none;
        margin-bottom: 25px;
    }

    .custom-list li {
        position: relative;
        padding-left: 20px;
        margin-bottom: 12px;
        color: #cbd5e1;
        font-size: 0.95rem;
        line-height: 1.4;
    }

    .custom-list li::before {
        content: "•";
        color: var(--gold);
        position: absolute;
        left: 0;
        top: -2px;
        font-size: 1.2rem;
    }

    .nota-box {
        background-color: rgba(245, 158, 11, 0.05);
        border: 1px solid rgba(245, 158, 11, 0.2);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 25px;
        color: var(--gold);
        font-size: 0.9rem;
        display: none;
    }

    .nota-box strong { font-weight: 600; }

    .modal-btn {
        display: block;
        width: 100%;
        text-align: center;
        background-color: var(--gold);
        color: #000;
        padding: 15px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.3s;
        margin-top: 10px;
        cursor: pointer;
    }

    .modal-btn:hover {
        background-color: var(--gold-hover);
    }

    /* MODAL DE EVALUACIÓN DE PERFIL */
    .eval-header {
        padding: 25px 25px 15px;
    }

    .eval-progress-bar {
        height: 3px;
        background-color: var(--gold);
        width: 25%;
        border-radius: 2px;
        margin-bottom: 15px;
        transition: width 0.3s ease;
    }

    .eval-header h3 {
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        color: #fff;
        margin-bottom: 6px;
    }

    .eval-header p {
        color: var(--text-muted);
        font-size: 0.85rem;
    }

    .eval-body {
        padding: 0 25px 25px;
    }

    .eval-question {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.05rem;
        font-weight: 600;
        color: #ffffff;
        margin-bottom: 20px;
    }

    .eval-question-icon {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--gold);
        color: var(--gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        flex-shrink: 0;
    }

    .eval-option {
        background-color: #1a2333;
        border: 1px solid #2a364f;
        border-radius: 10px;
        padding: 16px 20px;
        margin-bottom: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #e2e8f0;
        font-size: 0.95rem;
        transition: all 0.2s ease;
    }

    .eval-option:hover {
        border-color: var(--gold);
        background-color: rgba(245, 158, 11, 0.05);
    }

    .eval-radio {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1px solid var(--gold);
        display: inline-block;
        flex-shrink: 0;
    }

    .eval-form-group {
        margin-bottom: 15px;
    }

    .eval-form-group label {
        display: block;
        color: var(--text-muted);
        font-size: 0.85rem;
        margin-bottom: 6px;
    }

    .eval-input, .eval-select {
        width: 100%;
        padding: 14px 16px;
        background-color: #1a2333;
        border: 1px solid #2a364f;
        border-radius: 8px;
        color: #ffffff;
        font-size: 0.95rem;
        outline: none;
    }

    .eval-input:focus, .eval-select:focus {
        border-color: var(--gold);
    }

    .eval-step {
        display: none;
    }

    .eval-step.active {
        display: block;
    }

    /* OPTIMIZACIÓN MÓVIL (RESPONSIVE) */
    @media (max-width: 768px) {
        header {
            flex-direction: column;
            gap: 15px;
            padding: 15px;
            text-align: center;
        }
        nav ul {
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hero {
            padding: 0 5%;
            text-align: center;
            align-items: center;
        }
        .hero h1 {
            font-size: 2.8rem;
        }
        .hero p {
            font-size: 1rem;
        }
        .cta-buttons {
            flex-direction: column;
            width: 100%;
            max-width: 300px;
            gap: 10px;
        }
        .btn-primary, .btn-secondary {
            text-align: center;
            width: 100%;
        }
        .badge {
            margin: 0 auto 20px auto;
        }
        .nosotros-section, .destinos-section {
            padding: 60px 5%;
        }
        .section-header h2, .destinos-header h2 {
            font-size: 2.2rem;
        }
        .info-boxes {
            flex-direction: column;
            gap: 10px;
        }
        .modal-header-bg {
            height: 120px;
        }
        .modal-title {
            font-size: 1.8rem;
        }
        .modal-price {
            font-size: 1.3rem;
        }
        .floating-social {
            bottom: 15px;
            right: 15px;
        }
        .floating-btn {
            width: 45px;
            height: 45px;
            font-size: 22px;
        }
    }

    @media (max-width: 480px) {
        .hero h1 {
            font-size: 2.3rem;
        }
        .modal-content {
            width: 95%;
            margin: 10px;
        }
        .eval-question {
            font-size: 0.95rem;
        }
        .eval-option {
            padding: 12px 15px;
        }
    }
</style>
